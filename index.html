function calculatePPVNPV(sensitivity, specificity, prevalence) {
  if (sensitivity == null || specificity == null || prevalence == null) return { ppv: null, npv: null };
  const sens = sensitivity / 100;
  const spec = specificity / 100;
  const prev = prevalence / 100;
  const ppv = (sens * prev) / (sens * prev + (1 - spec) * (1 - prev));
  const npv = (spec * (1 - prev)) / (spec * (1 - prev) + (1 - sens) * prev);
  return { ppv: ppv * 100, npv: npv * 100 };
}

function BmsCalculator() {
  const [gram, setGram] = useState(false);
  const [csf_anc, setCsfAnc] = useState(false);
  const [csf_prot, setCsfProt] = useState(false);
  const [peri_anc, setPeriAnc] = useState(false);
  const [seizure, setSeizure] = useState(false);

  const score = (gram ? 2 : 0) + (csf_anc ? 1 : 0) + (csf_prot ? 1 : 0) + (peri_anc ? 1 : 0) + (seizure ? 1 : 0);
  const lowRisk = score === 0;

  return (
    <div style={{ marginTop: 16 }}>
      <h3 style={{ fontSize: 16, fontWeight: 700, margin: "0 0 6px", fontFamily: sf }}>Bacterial Meningitis Score (Nigrovic)</h3>
      <p style={{ fontSize: 11, color: "#666", margin: "0 0 12px" }}>
        For children 29 days–19 yrs with CSF pleocytosis (WBC ≥10). NOT validated for: age &lt;29 days, immunosuppressed, VP shunt, recent neurosurgery, concurrent bacterial infection, or pre-treated with antibiotics.
        <span style={{ marginLeft: 4 }}><RefLink id="nigrovic_meta" /></span>
      </p>
      {[
        { label: "Positive CSF Gram stain", val: gram, set: setGram, pts: 2 },
        { label: "CSF ANC ≥1,000 cells/µL", val: csf_anc, set: setCsfAnc, pts: 1 },
        { label: "CSF protein ≥80 mg/dL", val: csf_prot, set: setCsfProt, pts: 1 },
        { label: "Peripheral blood ANC ≥10,000 cells/µL", val: peri_anc, set: setPeriAnc, pts: 1 },
        { label: "Seizure at or prior to presentation", val: seizure, set: setSeizure, pts: 1 },
      ].map(item => (
        <label key={item.label} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 12px", marginBottom: 4, borderRadius: 6, background: item.val ? "#FEF3C7" : "#f9fafb", cursor: "pointer", fontSize: 13, fontFamily: sf, border: "1px solid #e5e7eb" }}>
          <input type="checkbox" checked={item.val} onChange={() => item.set(!item.val)} style={{ width: 18, height: 18, accentColor: "#D97706" }} />
          <span style={{ flex: 1 }}>{item.label}</span>
          <span style={{ fontSize: 11, color: "#999", fontWeight: 600 }}>+{item.pts}</span>
        </label>
      ))}
      <div style={{ marginTop: 14, padding: 16, borderRadius: 10, border: `2px solid ${lowRisk ? "#059669" : "#DC2626"}`, background: lowRisk ? "#D1FAE5" : "#FEE2E2" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <span style={{ fontSize: 14, fontWeight: 700, fontFamily: sf, color: lowRisk ? "#065F46" : "#991B1B" }}>
            Score: {score} / 6 — {lowRisk ? "LOW RISK for bacterial meningitis" : "NOT low risk — consider bacterial meningitis"}
          </span>
        </div>
        <div style={{ fontSize: 12, marginTop: 8, color: lowRisk ? "#065F46" : "#991B1B", lineHeight: 1.6 }}>
          {lowRisk ? (
            <>Score of 0 → Very low risk of bacterial meningitis. Meta-analysis (8 studies, n=4,896): sensitivity 99.3% (95% CI 98.7–99.7%), NPV 99.7% (99.3–99.9%). Consider withholding/discontinuing empiric antibiotics. BUT: use caution in infants &lt;60 days (sensitivity lower in this group — Rees 2019).</>
          ) : (
            <>Score ≥1 → Cannot rule out bacterial meningitis with this score alone. Continue empiric antibiotics and admit pending cultures. Specificity 62.1% — many children with score ≥1 will have viral meningitis, but the score is designed for high sensitivity at the expense of specificity.</>
          )}
        </div>
      </div>
    </div>
  );
}

                </div>

                <div style={{ padding: 16, borderRadius: 10, border: `2px solid ${pathogen.canDischarge ? "#059669" : "#DC2626"}`, background: pathogen.canDischarge ? "#D1FAE5" : "#FEE2E2", marginBottom: 16 }}>
                  <h3 style={{ fontSize: 14, fontWeight: 700, margin: "0 0 10px", color: pathogen.canDischarge ? "#065F46" : "#991B1B", fontFamily: sf }}>
                    {pathogen.canDischarge ? "✓ Outpatient Management May Be Appropriate" : "✗ Inpatient Admission Required"}
                  </h3>
                  <div style={{ fontSize: 12, lineHeight: 1.7, whiteSpace: "pre-line", color: pathogen.canDischarge ? "#065F46" : "#991B1B" }}>{pathogen.dischargeNote}</div>
                </div>

                <div style={{ padding: 14, background: "#EFF6FF", border: "1px solid #BFDBFE", borderRadius: 8, fontSize: 12, color: "#1E3A5F", lineHeight: 1.6 }}>
                  <strong>Pediatric Considerations:</strong> {pathogen.keyPediatricConsiderations}
                </div>
              </div>
            )}
          </div>
        </div>
      )}

      {/* References */}
      <div style={{ marginTop: 32, borderTop: "2px solid #e5e7eb", paddingTop: 16 }}>
        <button onClick={() => setShowSources(!showSources)} style={{ background: "none", border: "none", cursor: "pointer", fontSize: 13, color: "#666", fontWeight: 600, fontFamily: sf, padding: 0 }}>
          {showSources ? "▾" : "▸"} All References (clickable links)
        </button>
        {showSources && (
          <div style={{ marginTop: 12, fontSize: 11, color: "#555", lineHeight: 2.0 }}>
            {Object.entries(REFS).map(([key, r]) => (
              <p key={key} style={{ margin: "2px 0" }}>
                <a href={r.url} target="_blank" rel="noopener noreferrer" style={{ color: "#2563EB", textDecoration: "none" }}>{r.full}</a>
              </p>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<BioFireMEPanelTool />);
</script>
</body>
</html>
