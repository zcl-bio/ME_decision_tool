function calculatePPVNPV(sens, spec, prev) {
  if (sens == null || spec == null || prev == null) return { ppv: null, npv: null };
  const s = sens/100, p = spec/100, r = prev/100;
  const ppv = (s*r)/(s*r+(1-p)*(1-r));
  const npv = (p*(1-r))/(p*(1-r)+(1-s)*r);
  return { ppv: ppv*100, npv: npv*100 };
}

function BmsCalc() {

  const [csfAnc,setCsfAnc]=useState(false);
  const [csfProt,setCsfProt]=useState(false);
  const [periAnc,setPeriAnc]=useState(false);
  const [seizure,setSeizure]=useState(false);
  const score=(gram?2:0)+(csfAnc?1:0)+(csfProt?1:0)+(periAnc?1:0)+(seizure?1:0);
  const low=score===0;
  return (
    <div style={{marginTop:16}}>

      {[

          <span style={{flex:1}}>{it.label}</span>

        <div style={{fontSize:14,fontWeight:700,fontFamily:sf,color:low?"#065F46":"#991B1B"}}>Score: {score}/6 — {low?"LOW RISK":"NOT low risk — treat as bacterial meningitis"}</div>
        <div style={{fontSize:12,marginTop:6,color:low?"#065F46":"#991B1B",lineHeight:1.6}}>

        </div>
      </div>
    </div>
  );
}

function MseCalc() {
  const [pct,setPct]=useState(false);
  const [csfProt,setCsfProt]=useState(false);
  const [crp,setCrp]=useState(false);
  const [csfAnc,setCsfAnc]=useState(false);
  const score=(pct?3:0)+(csfProt?2:0)+(crp?1:0)+(csfAnc?1:0);
  const low=score===0;
  return (
    <div style={{marginTop:16}}>
      <h3 style={{fontSize:15,fontWeight:700,margin:"0 0 4px",fontFamily:sf}}>Meningitis Score for Emergencies (MSE)</h3>
      <p style={{fontSize:11,color:"#666",margin:"0 0 10px"}}>Requires procalcitonin and CRP (not always available in all EDs). <RefLink id="mintegi" /></p>
      {[
        {label:"Procalcitonin >1.2 ng/mL",val:pct,set:setPct,pts:3},
        {label:"CSF protein >80 mg/dL",val:csfProt,set:setCsfProt,pts:2},
        {label:"CRP >40 mg/L",val:crp,set:setCrp,pts:1},
        {label:"CSF ANC >1,000 cells/mm³",val:csfAnc,set:setCsfAnc,pts:1},
      ].map(it=>(
        <label key={it.label} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",marginBottom:4,borderRadius:6,background:it.val?"#EDE9FE":"#f9fafb",cursor:"pointer",fontSize:13,fontFamily:sf,border:"1px solid #e5e7eb"}}>
          <input type="checkbox" checked={it.val} onChange={()=>it.set(!it.val)} style={{width:18,height:18,accentColor:"#7C3AED"}} />
          <span style={{flex:1}}>{it.label}</span>
          <span style={{fontSize:11,color:"#999",fontWeight:600}}>+{it.pts}</span>
        </label>
      ))}
      <div style={{marginTop:12,padding:14,borderRadius:10,border:`2px solid ${low?"#059669":"#7C3AED"}`,background:low?"#D1FAE5":"#EDE9FE"}}>
        <div style={{fontSize:14,fontWeight:700,fontFamily:sf,color:low?"#065F46":"#5B21B6"}}>Score: {score}/7 — {low?"LOW RISK (MSE 0)":"NOT low risk — treat as bacterial"}</div>
        <div style={{fontSize:12,marginTop:6,color:low?"#065F46":"#5B21B6",lineHeight:1.6}}>
          {low ? <>MSE 0 → sensitivity 100% (95% CI 95–100%), specificity 83.2%, NPV 100%. Higher specificity than BMS. Consider withholding abx if procalcitonin and CRP available.</> : <>MSE ≥1 → Cannot rule out bacterial meningitis. Continue empiric therapy.</>}
        </div>
      </div>
    </div>
  );
}

              <br/>• <strong>Tansarli 2020</strong>: 8 studies, 3,059 patients. Overall panel: sensitivity 90% (86–93%), specificity 97% (94–99%). Focused on discordant/FP results. <RefLink id="tansarli" />
              <br/>• <strong>Trujillo-Gómez 2022</strong>: 19 studies, 11,351 patients. Per-pathogen analysis. All bacteria (vs culture): sensitivity 89.5% (81–94%), specificity 97.4% (94–99%). Noted suboptimal sensitivity for HSV-1, Listeria, H. flu, E. coli. Higher specificity (~99%) when using clinical adjudication as reference. <RefLink id="trujillo" />
              <br/>• <strong>Key difference:</strong> Trujillo-Gómez is larger, more recent, and provides per-pathogen breakdowns. Tansarli focused more on FP/FN adjudication. Both agree on ~90% overall sensitivity and &gt;97% specificity.
            </div>
          </div>
        </div>
      )}

      {/* PATHOGEN DETAIL */}
      {p && (
        <div style={{border:"2px solid #d1d5db",borderRadius:12,overflow:"hidden"}}>
          <div style={{background:"#f3f4f6",padding:"14px 18px",borderBottom:"2px solid #d1d5db"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
              <div>
                <h2 style={{margin:0,fontSize:20,color:"#1a1a2e"}}>{p.name}</h2>
                <span style={{fontSize:11,color:"#666"}}>{p.categoryLabel}</span>
              </div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {p.amxIndicated && p.amxLabel && (
                  <div style={{padding:"5px 12px",borderRadius:20,fontWeight:700,fontSize:11,fontFamily:sf,textTransform:"uppercase",letterSpacing:0.5,background:"#FEF3C7",border:"2px solid #D97706",color:"#78350F"}}>
                    {p.amxLabel}
                  </div>
                )}
                {!p.amxIndicated && p.amxLabel && (
                  <div style={{padding:"5px 12px",borderRadius:20,fontWeight:700,fontSize:11,fontFamily:sf,textTransform:"uppercase",letterSpacing:0.5,background:"#FEF3C7",border:"2px solid #D97706",color:"#78350F"}}>
                    {p.amxLabel}
                  </div>
                )}
                <div style={{padding:"5px 12px",borderRadius:20,fontWeight:700,fontSize:11,fontFamily:sf,textTransform:"uppercase",letterSpacing:0.5,background:p.canDischarge?"#D1FAE5":"#FEE2E2",border:`2px solid ${p.canDischarge?"#059669":"#DC2626"}`,color:p.canDischarge?"#065F46":"#991B1B"}}>
                  {p.canDischarge?"↑ Discharge may be appropriate":"↓ Admission required"}
                </div>
              </div>
            </div>
          </div>

          {/* Tabs — PPV first */}
          <div style={{display:"flex",borderBottom:"1px solid #e5e7eb",background:"#fafafa"}}>
            {[{id:"ppv",label:"Predictive Value"},{id:"test",label:"Test Characteristics"},{id:"tx",label:"Treatment & Disposition"}].map(t=>(
              <button key={t.id} onClick={()=>setTab(t.id)}
                style={{flex:1,padding:"11px 6px",border:"none",borderBottom:tab===t.id?"3px solid #1a1a2e":"3px solid transparent",background:tab===t.id?"#fff":"transparent",fontWeight:tab===t.id?700:500,fontSize:12,cursor:"pointer",color:tab===t.id?"#1a1a2e":"#666",fontFamily:sf}}>
                {t.label}
              </button>
            ))}
          </div>

          <div style={{padding:18}}>
            {/* PPV TAB */}
            {tab==="ppv" && (
              <div>
                {/* Sensitivity basis toggle */}
                <div style={{marginBottom:14,padding:"10px 14px",background:"#f3f4f6",borderRadius:8,border:"1px solid #e5e7eb"}}>
                  <div style={{fontSize:11,fontWeight:600,fontFamily:sf,color:"#555",marginBottom:6}}>Sensitivity basis for PPV/NPV calculation:</div>
                  <div style={{display:"flex",gap:6}}>
                    {[{id:"clinical",label:"Clinical (real-world)"},{id:"analytical",label:"Analytical (contrived samples)"}].map(o=>(
                      <button key={o.id} onClick={()=>setSensBasis(o.id)}
                        style={{flex:1,padding:"7px 10px",borderRadius:6,border:`1.5px solid ${sensBasis===o.id?"#1a1a2e":"#d1d5db"}`,background:sensBasis===o.id?"#1a1a2e":"#fff",color:sensBasis===o.id?"#fff":"#555",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:sf,textAlign:"center"}}>
                        {o.label}
                      </button>
                    ))}
                  </div>
                  <div style={{fontSize:10,color:"#888",marginTop:6,fontFamily:sf}}>
                    {sensBasis==="clinical"
                      ? "Uses best clinical estimate from published studies. For some rare pathogens, clinical sensitivity is unknown (shown as N/A)."
                      : "Uses analytical sensitivity from FDA contrived/spiked specimen testing (~100% at ≥ limit of detection). Represents BEST-CASE scenario — real clinical sensitivity may be lower if pathogen concentration is below LoD."}
                  </div>
                </div>

                <div style={{marginBottom:6,fontSize:11,color:"#666",fontFamily:sf}}>
                  Age group: <strong>{ageGroup==="young"?"≤3 months":ageGroup==="older"?"3 mo – 15 yr":"All pediatric"}</strong> — prevalence {basePrev}%
                </div>
                <div style={{marginBottom:18}}>
                  <label style={{display:"block",fontSize:13,fontWeight:600,marginBottom:6,fontFamily:sf}}>
                    Pre-test Prevalence: <span style={{color:catCol[p.category].accent,fontSize:18}}>{prevalence.toFixed(2)}%</span>
                  </label>
                  <input type="range" min="0.01" max="25" step="0.01" value={prevalence} onChange={e=>setCustPrev(parseFloat(e.target.value))} style={{width:"100%",accentColor:catCol[p.category].accent}} />
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"#999",fontFamily:sf}}>
                    <span>0.01%</span>
                    <span style={{cursor:"pointer",color:catCol[p.category].accent,fontWeight:600}} onClick={()=>setCustPrev(null)}>Reset to age-based ({basePrev}%)</span>
                    <span>25%</span>
                  </div>
                  <div style={{marginTop:6,fontSize:11,color:"#666",fontStyle:"italic"}}>{p.prevNote} <RefLinks ids={p.prevRefs} /></div>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:18}}>
                  {[{label:"Positive Predictive Value",val:pv[sensBasis]?.ppv,desc:"P(true pathogen | positive result)"},{label:"Negative Predictive Value",val:pv[sensBasis]?.npv,desc:"P(truly absent | negative result)"}].map((it,i)=>(
                    <div key={i} style={{background:"#f9fafb",border:"1px solid #e5e7eb",borderRadius:10,padding:14,textAlign:"center"}}>
                      <div style={{fontSize:10,fontWeight:600,textTransform:"uppercase",letterSpacing:1,color:"#666",marginBottom:6,fontFamily:sf}}>{it.label}</div>
                      <div style={{fontSize:34,fontWeight:800,color:it.val==null?"#999":it.val>=90?"#059669":it.val>=70?"#D97706":"#DC2626",fontFamily:sf}}>{it.val!=null?`${it.val.toFixed(1)}%`:"N/A"}</div>
                      <div style={{fontSize:10,color:"#888",marginTop:4,fontFamily:sf}}>{it.desc}</div>
                      <div style={{fontSize:9,color:"#aaa",marginTop:2,fontFamily:sf}}>Using {sensBasis==="clinical"?"clinical":"analytical"} sensitivity</div>
                    </div>
                  ))}
                </div>
                {pv[sensBasis]?.ppv!=null && (
                  <div style={{fontSize:12,color:"#444",background:"#f3f4f6",padding:12,borderRadius:8,lineHeight:1.6}}>
                    <strong>At {prevalence.toFixed(2)}% prevalence ({sensBasis} sensitivity):</strong>{" "}
                    {pv[sensBasis].ppv<50 ? "A positive result is more likely FALSE POSITIVE than true positive. Confirmatory testing strongly recommended."
                      : pv[sensBasis].ppv<80 ? `~1 in ${Math.round(100/(100-pv[sensBasis].ppv))} positive results may be FP. Clinical correlation and/or confirmatory testing recommended.`
                      : "A positive result has strong predictive value. Clinical correlation still recommended per FDA labeling."}
                  </div>
                )}
              </div>
            )}

            {/* TEST CHAR TAB */}
            {tab==="test" && (
              <div>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:12,fontFamily:sf}}>
                  <thead><tr style={{background:"#f3f4f6"}}>
                    <th style={{padding:"8px 10px",textAlign:"left",borderBottom:"2px solid #ddd",fontWeight:700}}>Source</th>
                    <th style={{padding:"8px 10px",textAlign:"center",borderBottom:"2px solid #ddd",fontWeight:700}}>Sens</th>
                    <th style={{padding:"8px 10px",textAlign:"center",borderBottom:"2px solid #ddd",fontWeight:700}}>Spec</th>
                    <th style={{padding:"8px 10px",textAlign:"left",borderBottom:"2px solid #ddd",fontWeight:700}}>Notes</th>
                  </tr></thead>
                  <tbody>
                    <tr style={{background:"#EFF6FF"}}>
                      <td style={{padding:"8px 10px",borderBottom:"1px solid #eee",fontWeight:700,color:"#1E40AF"}}>Analytical (contrived) <RefLinks ids={["fda"]}/></td>
                      <td style={{padding:"8px 10px",borderBottom:"1px solid #eee",textAlign:"center",fontWeight:700,color:"#059669"}}>{p.analyticSens}%</td>
                      <td style={{padding:"8px 10px",borderBottom:"1px solid #eee",textAlign:"center",fontWeight:700,color:"#059669"}}>{p.analyticSpec}%</td>
                      <td style={{padding:"8px 10px",borderBottom:"1px solid #eee",fontSize:11,color:"#1E40AF"}}>{p.analyticNote}</td>
                    </tr>
                    <tr>
                      <td style={{padding:"8px 10px",borderBottom:"1px solid #eee",fontWeight:600}}>Clinical — FDA / Leber 2016 <RefLinks ids={p.fdaRefs}/></td>
                      <td style={{padding:"8px 10px",borderBottom:"1px solid #eee",textAlign:"center",fontWeight:700,color:p.fdaSens==null?"#999":p.fdaSens>=95?"#059669":p.fdaSens>=85?"#D97706":"#DC2626"}}>{p.fdaSens!=null?`${p.fdaSens}%`:"N/A"}</td>
                      <td style={{padding:"8px 10px",borderBottom:"1px solid #eee",textAlign:"center",fontWeight:700,color:"#059669"}}>{p.fdaSpec!=null?`${p.fdaSpec}%`:"N/A"}</td>
                      <td style={{padding:"8px 10px",borderBottom:"1px solid #eee",fontSize:11,color:"#666"}}>{p.fdaNote}</td>
                    </tr>
                    {p.trujilloSens!=null && (
                      <tr>
                        <td style={{padding:"8px 10px",borderBottom:"1px solid #eee",fontWeight:600}}>Trujillo-Gómez 2022 <RefLinks ids={p.trujilloRefs}/></td>
                        <td style={{padding:"8px 10px",borderBottom:"1px solid #eee",textAlign:"center",fontWeight:700,color:p.trujilloSens>=95?"#059669":p.trujilloSens>=85?"#D97706":"#DC2626"}}>{p.trujilloSens}%</td>
                        <td style={{padding:"8px 10px",borderBottom:"1px solid #eee",textAlign:"center",fontWeight:700,color:"#059669"}}>{p.trujilloSpec}%</td>
                        <td style={{padding:"8px 10px",borderBottom:"1px solid #eee",fontSize:11,color:"#666"}}>{p.trujilloNote}</td>
                      </tr>
                    )}
                    <tr style={{background:"#f0fdf4"}}>
                      <td style={{padding:"8px 10px",fontWeight:700}}>Best Clinical Estimate <RefLinks ids={p.bestRefs}/></td>
                      <td style={{padding:"8px 10px",textAlign:"center",fontWeight:700,color:p.bestSens==null?"#999":p.bestSens>=95?"#059669":p.bestSens>=85?"#D97706":"#DC2626"}}>{p.bestSens!=null?`${p.bestSens}%`:"Unknown"}</td>
                      <td style={{padding:"8px 10px",textAlign:"center",fontWeight:700,color:"#059669"}}>{p.bestSpec!=null?`${p.bestSpec}%`:"Unknown"}</td>
                      <td style={{padding:"8px 10px",fontSize:11,color:"#444",fontWeight:500}}>{p.bestNote}</td>
                    </tr>
                  </tbody>
                </table>
                {p.importantNotes && (
                  <div style={{marginTop:14,padding:12,background:"#FFFBEB",border:"1px solid #FCD34D",borderRadius:8,fontSize:12,color:"#78350F",lineHeight:1.5}}>
                    <strong>⚠ Important:</strong> {p.importantNotes}
                  </div>
                )}
              </div>
            )}

            {/* TX TAB */}
            {tab==="tx" && (
              <div>
                <div style={{marginBottom:14}}>
                  <h3 style={{fontSize:12,textTransform:"uppercase",letterSpacing:1,color:"#666",marginBottom:6,fontFamily:sf}}>Pathogen-Specific Treatment</h3>
                  <div style={{padding:12,background:"#f9fafb",border:"1px solid #e5e7eb",borderRadius:8,fontSize:13,lineHeight:1.6}}>{p.treatment}</div>
                  <div style={{marginTop:6,display:"flex",gap:6,flexWrap:"wrap"}}>
                    <span style={{padding:"3px 10px",borderRadius:12,fontSize:10,fontWeight:600,background:p.treatmentRoute.includes("IV")?"#FEE2E2":"#D1FAE5",color:p.treatmentRoute.includes("IV")?"#991B1B":"#065F46",fontFamily:sf}}>Route: {p.treatmentRoute}</span>
                    {p.guidelineRefs.length>0 && <span style={{padding:"3px 10px",borderRadius:12,fontSize:10,fontWeight:600,background:"#EFF6FF",color:"#1E40AF",fontFamily:sf}}>{p.guidelineRefs.map((id,i)=><span key={id}>{i>0&&", "}<RefLink id={id}/></span>)}</span>}
                  </div>
                </div>

                {/* Empiric management */}
                <div style={{marginBottom:14}}>
                  <h3 style={{fontSize:12,textTransform:"uppercase",letterSpacing:1,color:"#666",marginBottom:6,fontFamily:sf}}>Empiric Therapy Management</h3>
                  <div style={{padding:12,background:"#DBEAFE",border:"1px solid #93C5FD",borderRadius:8,fontSize:12,lineHeight:1.6,color:"#1E3A5F",marginBottom:6}}>
                    <strong>Antibiotics:</strong> {p.empiricAbx}
                  </div>
                  <div style={{padding:12,background:"#EDE9FE",border:"1px solid #C4B5FD",borderRadius:8,fontSize:12,lineHeight:1.6,color:"#5B21B6"}}>
                    <strong>Antivirals:</strong> {p.empiricAntiviral}
                  </div>
                </div>

                {/* Disposition */}
                <div style={{padding:14,borderRadius:10,border:`2px solid ${p.canDischarge?"#059669":"#DC2626"}`,background:p.canDischarge?"#D1FAE5":"#FEE2E2",marginBottom:14}}>
                  <h3 style={{fontSize:13,fontWeight:700,margin:"0 0 8px",color:p.canDischarge?"#065F46":"#991B1B",fontFamily:sf}}>
                    {p.canDischarge?"✓ Outpatient Management May Be Appropriate":"✗ Inpatient Admission Required"}
                  </h3>
                  <div style={{fontSize:12,lineHeight:1.7,whiteSpace:"pre-line",color:p.canDischarge?"#065F46":"#991B1B"}}>{p.dischargeNote}</div>
                </div>

                <div style={{padding:12,background:"#EFF6FF",border:"1px solid #BFDBFE",borderRadius:8,fontSize:12,color:"#1E3A5F",lineHeight:1.6}}>
                  <strong>Pediatric Considerations:</strong> {p.pedNotes}
                </div>
              </div>
            )}
          </div>
        </div>
      )}

      {/* References */}
      <div style={{marginTop:28,borderTop:"2px solid #e5e7eb",paddingTop:14}}>
        <button onClick={()=>setShowSrc(!showSrc)} style={{background:"none",border:"none",cursor:"pointer",fontSize:12,color:"#666",fontWeight:600,fontFamily:sf,padding:0}}>
          {showSrc?"▾":"▸"} All References
        </button>
        {showSrc && (
          <div style={{marginTop:10,fontSize:11,color:"#555",lineHeight:2}}>
            {Object.entries(REFS).map(([k,r])=>(
              <p key={k} style={{margin:"1px 0"}}><a href={r.url} target="_blank" rel="noopener noreferrer" style={{color:"#2563EB",textDecoration:"none"}}>{r.short}</a> — {r.url}</p>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
